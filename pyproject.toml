[project]
name = "remvalgate"
version = "0.1.0"
description = "A fine-tuned validity gate for agentic Kubernetes incident remediation"
readme = "README.md"
# matches the range AIOpsLab supports
requires-python = ">=3.11,<3.13"
dependencies = [
    "aiopslab",
    "rank-bm25>=0.2.2",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pytest>=8.3",
    "ruff>=0.6",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
]
retrieval = [
    "sentence-transformers>=6.2",
]

[tool.uv.sources]
aiopslab = { path = "external/AIOpsLab", editable = true }

[build-system]
requires = ["hatchling>=1.32,<2"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["external"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
